name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: orkunerylmz
          SETTING_JSON: .github/profile-3d-blueberry.json

      - name: Add rounded corners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("profile-3d-contrib/profile-blueberry.svg")
          svg = path.read_text()

          svg = re.sub(
              r'<rect([^>]*?)>',
              lambda m: '<rect' + m.group(1) + ' rx="5" ry="5">',
              svg,
              count=1
          )

          path.write_text(svg)
          PY

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Update 3D contribution graph"; then
            git push
          fi